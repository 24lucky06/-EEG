<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EEG Sleep Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dashboard">
    <section class="hero">
      <p class="eyebrow">Dual-channel EEG Sleep Monitoring</p>
      <h1>睡眠状态实时监测系统</h1>
      <p>用于展示脑电波形、当前睡眠阶段、阶段概率和睡眠质量评分。当前页面是 UI 原型，后续可与 app.py 后端接口连接。</p>
    </section>

    <section class="cards">
      <div class="card large">
        <h2>实时脑电波形</h2>
        <div class="wave">C3 / O1 waveform placeholder</div>
      </div>
      <div class="card">
        <h2>当前阶段</h2>
        <div class="stage">N2</div>
      </div>
      <div class="card">
        <h2>睡眠质量</h2>
        <div class="score">82</div>
        <p>等级：良好</p>
      </div>
    </section>

    <section class="card">
      <h2>阶段结构</h2>
      <div class="timeline">
        <span>W</span><span>N1</span><span>N2</span><span>N3</span><span>REM</span>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
